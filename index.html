<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Puzzle Play — Sudoku, Word Search & Jigsaw. Zero ads.</title>
    <meta name="description" content="Three puzzle games built by a puzzle lover who got tired of ads. Sudoku, Word Search and Jigsaw — no interruptions, no tracking, just the game." />

    <!-- App-like behavior when saved to home screen -->
    <meta name="theme-color" content="#F5F1E8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Puzzle Play" />

    <!-- Social sharing -->
    <meta property="og:title" content="Puzzle Play — puzzles without the ads" />
    <meta property="og:description" content="Sudoku, Word Search and Jigsaw. No ads, no popups, no energy timers. Just play." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Catch any unhandled JS errors before React loads
      window.onerror = function(msg, src, line, col, err) {
        document.body.style.background = '#F5F1E8';
        document.body.style.color = '#17171A';
        document.body.style.fontFamily = 'monospace';
        document.body.style.padding = '32px';
        document.body.style.whiteSpace = 'pre-wrap';
        document.body.innerHTML = '<b style="font-size:18px">Something went wrong</b>\n\n' + msg + '\n\nFile: ' + src + ':' + line + ':' + col + '\n\n' + (err && err.stack ? err.stack : '');
        return false;
      };
      window.onunhandledrejection = function(e) {
        window.onerror(String(e.reason), '', 0, 0, e.reason instanceof Error ? e.reason : null);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
